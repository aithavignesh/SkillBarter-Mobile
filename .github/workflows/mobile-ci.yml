name: Mobile CI

on:
  pull_request:
    branches:
      - development
      - ui/bhuvan

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, lint, tests and Expo exports
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Unit and integration tests
        run: npm test
      - name: Expo Android bundle export
        run: npx expo export --platform android
      - name: Expo iOS bundle export
        run: npx expo export --platform ios
